- id: '1675612618800'
  alias: 'Haustür Bewegungsmelder '
  description: ''
  use_blueprint:
    path: Blackshome/sensor-light.yaml
    input:
      motion_trigger:
      - binary_sensor.bewegungsmelder_haustur_occupancy
      light_switch:
        entity_id:
        - light.haustur_lampe_1
        - light.haustur_lampe_2
      ambient_light_sensor: sensor.bewegungsmelder_haustur_illuminance_lux
      ambient_light_options: ambient_light_option_disabled
      time_delay: 1
      include_light_control: use_brightness
      include_ambient: ambient_disabled
      ambient_light_value: 90
      include_sun: sun_enabled
      sun_elevation: 0
- id: '1678299190989'
  alias: Send Notification
  trigger:
  - platform: numeric_state
    entity_id: sensor.hum_abs_keller
    above: sensor.hum_abs_outside
  condition:
  - condition: numeric_state
    entity_id: sensor.hum_abs_keller
    above: sensor.hum_abs_outside
  - condition: numeric_state
    entity_id: sensor.kellertemp_humidity
    attribute: humidity
    above: 60
  action:
  - service: notify.mobile_app_pixel_6
    data:
      message: Keller lüften wäre jetzt cool...
      title: Keller
- id: '1742507943698'
  alias: 'Batterie Benachrichtigung '
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.batt_temp_3
    - sensor.batt_temp_4
    - sensor.jk_bms_temperature_sensor_1
    - sensor.jk_bms_temperature_sensor_2
    - sensor.garage_temperatur
    above: 38
  - trigger: numeric_state
    entity_id:
    - sensor.jk_bms_max_cell_voltage
    above: 4.15
  - trigger: numeric_state
    entity_id:
    - sensor.batt_volt
    above: 53.5
  - trigger: numeric_state
    entity_id:
    - sensor.batt_volt
    below: 42
  - trigger: numeric_state
    entity_id:
    - sensor.jk_bms_min_cell_voltage
    below: 2.85
  conditions: []
  actions:
  - action: notify.mobile_app_pixel_6
    metadata: {}
    data:
      message: 'Batterie in Garage prüfen. Schlechte Werte '
  - action: notify.mobile_app_pixel_7a
    metadata: {}
    data:
      message: 'Batterie in Garage prüfen. Schlechte Werte '
  mode: single
- id: '1757929505256'
  alias: 'Überwachungskamera Meldung '
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - event.folder_watcher_recordings
    attribute: event_type
    to: created
  conditions: []
  actions:
  - action: notify.mobile_app_pixel_6
    metadata: {}
    data:
      message: Person vor {{ trigger.to_state.attributes.file.split("_")[0] }} {{
        trigger.to_state.attributes.path }}
      data:
        video: /media/local{{ trigger.to_state.attributes.path }}
  - action: notify.mobile_app_pixel_7a
    metadata: {}
    data:
      message: Person vor {{ trigger.to_state.attributes.file.split("_")[0] }}
      data:
        file: '{{ trigger.to_state.attributes.file }}'
  mode: single
- id: '1761660784691'
  alias: UseBatteryOn
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.pv_batt_soc
    above: 50
  conditions: []
  actions:
  - action: select.select_option
    metadata: {}
    data:
      option: useBattery
    target:
      entity_id: select.operationmode
  mode: single
- id: '1761661020488'
  alias: UsePV on
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.pv_batt_soc
    below: 45
  conditions: []
  actions:
  - action: select.select_option
    metadata: {}
    data:
      option: usePV
    target:
      entity_id: select.operationmode
  mode: single
- id: '1782373624103'
  alias: 'Keller Nass notification '
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.nassesensor_heizkeller_water_leak
    to:
    - 'on'
  - trigger: state
    entity_id:
    - binary_sensor.nassesensor_keller_water_leak
    to:
    - 'on'
  conditions: []
  actions:
  - data:
      message: Nässe festgestellt!
      title: Keller Nass!
    action: notify.mobile_app_pixel_6
  - data:
      message: Nässe festgestellt!
      title: Keller Nass!
    action: notify.mobile_app_pixel_7a
  mode: single
- id: '1782989990750'
  alias: Rolläden morgens öffnen
  description: 'Öffnet die Rollläden, sobald es hell wird, aber nicht vor 06:50 Uhr.'
  mode: single
  triggers:
    # Es wird hell: Die Sonne steigt über -4° (etwa bürgerliche Dämmerung)
    - trigger: numeric_state
      entity_id: sun.sun
      attribute: elevation
      above: -4
    # Frühester Zeitpunkt erreicht
    - trigger: time
      at: "06:50:00"
  conditions:
    # Beides muss erfüllt sein, egal welcher Trigger ausgelöst hat
    - condition: time
      after: "06:50:00"
      before: "12:00:00"
    - condition: numeric_state
      entity_id: sun.sun
      attribute: elevation
      above: -4
    # Sonne steigt (verhindert ein Auslösen am Abend)
    - condition: state
      entity_id: sun.sun
      attribute: rising
      state: true
  actions:
  - action: cover.open_cover
    target:
      entity_id:
        - cover.rolladen_kuche
        - cover.rolladen_sofa
        - cover.rolladen_essecke
  - delay:
      hours: 0
      minutes: 0
      seconds: 7
      milliseconds: 0
  - action: cover.open_cover
    target:
      entity_id:
        - cover.rolladen_terrasse
        - cover.rolladen_spielzimmer
        - cover.rolladen_arbeitszimmer
  - delay:
      hours: 0
      minutes: 0
      seconds: 7 
      milliseconds: 0
  - action: cover.open_cover
    target:
      entity_id:
        - cover.rolladen_badezimmer
        - cover.rolladen_nahzimmer
        - cover.rolladen_kinderzimmer
        - cover.rolladen_schlafzimmer
